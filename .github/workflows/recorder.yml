name: Solana recorder
# Read-only recorder of public market data. No wallet, no keys, no trades.
# It runs in rounds of about 55 minutes, taking a reading every 5 minutes, then starts the next round itself.
# It only runs while this repository is public (public repositories get free Actions minutes).
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/recorder.yml"
      - "scripts/sol_recorder.py"
permissions:
  contents: write
  actions: write
concurrency:
  group: recorder
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Stop if the repository is private
        id: vis
        run: |
          p=$(gh api repos/${{ github.repository }} -q .private)
          echo "private=$p" >> "$GITHUB_OUTPUT"
          if [ "$p" != "false" ]; then echo "Repository is private: the recorder does not run, to avoid using paid minutes."; fi
      - uses: actions/checkout@v4
        if: steps.vis.outputs.private == 'false'
        with:
          ref: main
      - uses: actions/setup-python@v5
        if: steps.vis.outputs.private == 'false'
        with:
          python-version: "3.12"
      - name: Record for about 55 minutes
        if: steps.vis.outputs.private == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          end=$((SECONDS + 3300))
          while [ $SECONDS -lt $end ]; do
            start=$SECONDS
            python scripts/sol_recorder.py || echo "recorder step failed"
            git add data && git commit -q -m "Recorder update" || true
            git pull -q --rebase origin main && git push -q || echo "save failed this time"
            wait=$((300 - (SECONDS - start)))
            if [ $wait -gt 0 ] && [ $((SECONDS + wait)) -lt $end ]; then sleep $wait; else break; fi
          done
          echo "ran_seconds=$SECONDS" >> "$GITHUB_ENV"
      - name: Start the next round
        if: steps.vis.outputs.private == 'false' && always()
        run: |
          if [ "${ran_seconds:-0}" -ge 1800 ]; then
            gh workflow run recorder.yml --ref main -R ${{ github.repository }}
          else
            echo "Round was cut short; the hourly schedule will restart it."
          fi
